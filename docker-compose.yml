services:
  db:
    image: postgres:16-alpine
    container_name: book_db
    restart: always
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - book-net

  backend:
    build:
      context: ./book-api
      dockerfile: Dockerfile
    container_name: book_backend
    restart: always
    depends_on:
      - db
    networks:
      - book-net

  frontend:
    build:
      context: ./book-ui
      dockerfile: Dockerfile
    container_name: book_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - book-net

  nginx:
    image: nginx:alpine
    container_name: book_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - book-net

volumes:
  postgres_data:

networks:
  book-net:
    driver: bridge